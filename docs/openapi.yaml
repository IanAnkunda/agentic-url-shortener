openapi: 3.0.3
info:
  title: Agentic URL Shortener API
  version: 1.0.0
paths:
  /api/v1/urls:
    post:
      summary: Create a short URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  example: https://example.com/very/long/path
                customAlias:
                  type: string
                  minLength: 4
                  maxLength: 32
                  pattern: '^[A-Za-z0-9_-]{4,32}$'
                ttlSeconds:
                  type: integer
                  minimum: 60
      responses:
        '201': { description: Created }
        '400': { description: Invalid input }
        '409': { description: Alias already exists }
  /{code}:
    get:
      summary: Redirect to the original URL
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '302': { description: Redirect }
        '404': { description: Unknown code }
        '410': { description: Expired link }
  /api/v1/urls/{code}/analytics:
    get:
      summary: Read aggregate analytics
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200': { description: Analytics result }
        '404': { description: Unknown code }
  /api/v1/urls/{code}:
    delete:
      summary: Delete a short URL
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
        '404': { description: Unknown code }
